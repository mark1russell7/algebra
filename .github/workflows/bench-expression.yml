# The bench of the time claim of A3 (docs/ROADMAP.md) on the corpus of A12: compileFloat against a written function.
# It starts packages/expression-bench, and keeps the raw PairedTime records, the written functions, the facts of each
# process and the report.
# Start it with: node ~/git/fleet/scripts/fleet.mjs dispatch mark1russell7/algebra bench-expression.yml "<reason>" --ref main --role algebra --heavy
name: Bench expression

on:
  workflow_dispatch:
    inputs:
      rounds:
        description: The rounds of each case and pair
        default: "31"
      ms:
        description: The time in milliseconds of one batch of the arm a
        default: "10"
      pairs:
        description: The pairs of PAIRS in cases.ts, with commas. The pair aa always runs.
        default: "ft,wt"

permissions:
  contents: read

# One bench at a time, so two benches do not share the runner.
concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

jobs:
  bench:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    permissions:
      contents: read
    env:
      ROUNDS: ${{ inputs.rounds }}
      MS: ${{ inputs.ms }}
      PAIRS: ${{ inputs.pairs }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: The machine
        run: |
          mkdir -p "$RUNNER_TEMP/out"
          { lscpu; nproc; free -m; node --version; git rev-parse HEAD; } > "$RUNNER_TEMP/out/machine.txt"
          cat "$RUNNER_TEMP/out/machine.txt"
      - name: Bench
        working-directory: packages/expression-bench
        run: node src/bench.ts --out "$RUNNER_TEMP/out" --rounds "$ROUNDS" --ms "$MS" --pairs "$PAIRS"
      - name: Summary
        if: always()
        run: cat "$RUNNER_TEMP/out/report.md" >> "$GITHUB_STEP_SUMMARY" || true
      # The raw records, the written functions, the facts of each process and the report, kept 90 days.
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: a12-bench
          path: ${{ runner.temp }}/out
          retention-days: 90
