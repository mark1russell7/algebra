# Builds packages/site and publishes it to GitHub Pages at https://mark1russell7.github.io/algebra/, with
# the shared Pages workflow of mark1russell7 (reusable-pages.yml of mark1russell7/template, its CI.md).
# The Pages source of the repository is "GitHub Actions" (Settings > Pages).
# The site reads the items of docs/ROADMAP.md and the package.json of each package at build time.
# A pull request builds and checks the site in a browser, with no deploy.
name: Pages

on:
  push:
    branches: [main]
  # After a release, so that the Releases page has the new version
  workflow_run:
    workflows: [Release]
    types: [completed]
    branches: [main]
  workflow_dispatch:
  pull_request:
  # Each day, in case a release fails after it publishes
  schedule:
    - cron: "9 5 * * *"

permissions: {}

# One deployment at a time. A newer push cancels a deployment that waits.
# Each pull request has its own group, and a newer push cancels its run.
concurrency:
  group: pages-${{ github.event_name == 'pull_request' && github.ref || 'deploy' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  pages:
    uses: mark1russell7/template/.github/workflows/reusable-pages.yml@c216644a252956d695bc2a785e80abccd98fa0d0 # main
    # The build job of the shared workflow gets only the read permissions. Only its deploy job,
    # which runs no code of the repository, writes to Pages.
    permissions:
      contents: read
      actions: read
      issues: read
      pull-requests: read
      checks: read
      statuses: read
      pages: write
      id-token: write
    with:
      # The Vite config reads docs/ROADMAP.md. A bad table stops the build, and the old site stays.
      build: pnpm --filter @algebra/site run build
      out: packages/site/dist
      env: '{"SITE_BASE": "/${{ github.event.repository.name }}"}'
      deploy: ${{ github.event_name != 'pull_request' }}
      # The site-pages action adds releases/, status/, data/releases.json and data/status.json to the built site.
      roadmap: docs/ROADMAP.md
      packages: "@mark1russell7/rational"
      site-name: algebra
      # The check opens each page in a browser at each width, in light and dark. The probe drives the explorer, the
      # evaluators and the cost section. The check reads the TypeScript source and removes its types.
      site-check: true
      site-check-pages: /,/releases/,/status/
      site-check-probe: packages/site/src/check-probe.ts
      data-stamps: packages/site/dist/data-stamps.json

  # This job examines the deployed site: the home page, the Releases page, the Status page and their data files.
  # It starts no code of the repository and reads only the public site.
  served:
    needs: pages
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions: {}
    steps:
      - name: The pages of the site are on the site
        shell: bash
        env:
          SITE: ${{ needs.pages.outputs.page-url }}
        run: |
          set -euo pipefail
          for f in "" data/releases.json data/status.json releases/ status/; do
            # A new deployment can take some seconds to be served, so each file gets 5 tries.
            ok=0
            for i in 1 2 3 4 5; do
              if curl -fsS -o /dev/null "${SITE%/}/$f"; then ok=1; break; fi
              sleep 10
            done
            if [ "$ok" != 1 ]; then echo "::error::The site has no /$f."; exit 1; fi
            echo "The site has /$f."
          done
          # grep -q stops at the first match, and then curl fails on a closed pipe. So grep reads the whole page.
          curl -fsS "${SITE%/}/" | grep -F "One expression, many evaluators" > /dev/null || { echo "::error::The home page has not the text of the site."; exit 1; }
          curl -fsS "${SITE%/}/data/status.json" | node -e 'JSON.parse(require("node:fs").readFileSync(0, "utf8")); console.log("data/status.json is JSON.")'
          curl -fsS "${SITE%/}/data/releases.json" | node -e 'JSON.parse(require("node:fs").readFileSync(0, "utf8")); console.log("data/releases.json is JSON.")'
