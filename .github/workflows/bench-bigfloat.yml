# The bench of A7 (docs/ROADMAP.md) on the corpus of A12: the verb bigfloat at each precision and the stage of
# @algebra/evaluator-select against the verbs exact and interval, with an A/A pair. It starts packages/bigfloat-bench,
# and keeps the raw PairedTime records, the error records of the stage, the facts of each process and the report.
# Start it with: gh workflow run bench-bigfloat.yml -R mark1russell7/algebra --ref main
name: Bench bigfloat

on:
  workflow_dispatch:
    inputs:
      rounds:
        description: The rounds of each case and pair
        default: "31"
      ms:
        description: The time in milliseconds of one batch of the arm a
        default: "10"
      precisions:
        description: The precisions in bits, with commas
        default: "64,128,256,512,1024,2048,4096"
      limit:
        description: The limit of the stage in bits
        default: "4096"

permissions:
  contents: read

# One bench at a time, so two benches do not share the runner.
concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

jobs:
  bench:
    runs-on: ubuntu-latest
    timeout-minutes: 340
    permissions:
      contents: read
    env:
      ROUNDS: ${{ inputs.rounds }}
      MS: ${{ inputs.ms }}
      PRECISIONS: ${{ inputs.precisions }}
      LIMIT: ${{ inputs.limit }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: The machine
        run: |
          mkdir -p "$RUNNER_TEMP/out"
          { lscpu; nproc; free -m; node --version; git rev-parse HEAD; } > "$RUNNER_TEMP/out/machine.txt"
          cat "$RUNNER_TEMP/out/machine.txt"
      # The step stops before the job, so a long run still gets to the summary and the upload.
      - name: Bench
        timeout-minutes: 320
        working-directory: packages/bigfloat-bench
        run: node src/bench.ts --out "$RUNNER_TEMP/out" --rounds "$ROUNDS" --ms "$MS" --precisions "$PRECISIONS" --limit "$LIMIT"
      - name: Summary
        if: always()
        run: cat "$RUNNER_TEMP/out/report.md" >> "$GITHUB_STEP_SUMMARY" || true
      # The raw records, the error records, the facts of the model, the facts of each process and the report, kept 90 days.
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: a7-bench
          path: ${{ runner.temp }}/out
          retention-days: 90
