# The census of the predicate inputs (roadmap item A13). It downloads the predicate dumps of a highways or packing run,
# starts packages/predicate-census on each set and keeps each report as an artifact.
# Start it with: gh workflow run census.yml -R mark1russell7/algebra -f run=<run id>
# For packing: -f repo=mark1russell7/packing -f prefix=predicates- -f sets='["pack-select-v2"]'
# The monthly study (study-monthly.yml) calls it too.
name: Census

on:
  workflow_call:
    inputs:
      repo:
        type: string
        default: mark1russell7/highways
      run:
        type: string
        required: true
      sets:
        type: string
        default: '["exact-v1","exact-v1-bounds","fixtures","fixtures-large","screen-v1","screen-v2","screen-v3"]'
      prefix:
        type: string
        default: predicate-dump-
  workflow_dispatch:
    inputs:
      repo:
        description: The repository of the dump run
        default: mark1russell7/highways
      run:
        description: The id of the dump run
        required: true
      sets:
        description: The sets, as a JSON list
        default: '["exact-v1","exact-v1-bounds","fixtures","fixtures-large","screen-v1","screen-v2","screen-v3"]'
      prefix:
        description: The name of each dump artifact is this prefix and the set
        default: predicate-dump-

permissions:
  contents: read

# One census of a dump run at a time. A second start of the same run waits.
concurrency:
  group: census-${{ inputs.run }}
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  census:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    permissions:
      contents: read
    strategy:
      fail-fast: false
      # The runners are shared by all repositories of the account (the rule runner-budget)
      max-parallel: 3
      matrix:
        set: ${{ fromJSON(inputs.sets) }}
    env:
      SET: ${{ matrix.set }}
      RUN: ${{ inputs.run }}
      REPO: ${{ inputs.repo }}
      PREFIX: ${{ inputs.prefix }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # The census examines the lines of highways that its rules copy, at the commit of the dump run. It reads these
      # files as text and starts no code of highways. Thus the job takes the tree as a tarball, not as a checkout of a
      # commit of another repository (CodeQL actions/cache-poisoning). A start by hand can name any run, so the run
      # must be a run of main that is not of a pull request.
      - name: The tree of highways at the commit of the dump run
        if: inputs.repo == 'mark1russell7/highways'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -o pipefail
          read -r branch event sha < <(gh run view "$RUN" -R "$REPO" --json headBranch,event,headSha -q '"\(.headBranch) \(.event) \(.headSha)"')
          case "$event" in pull_request*) echo "::error::Run $RUN of $REPO is a run of a pull request ($event)."; exit 1 ;; esac
          if [ "$branch" != main ]; then echo "::error::Run $RUN of $REPO is a run of $branch, not of main."; exit 1; fi
          mkdir highways-tree
          gh api "repos/$REPO/tarball/$sha" | tar -xz --strip-components=1 -C highways-tree
          echo "The tree of $REPO at $sha ($event on $branch)"
      # The tree of highways is not a change of this repository, so the field dirty of the report stays correct.
      - name: Exclude the tree of highways from the status
        if: inputs.repo == 'mark1russell7/highways'
        run: echo highways-tree >> .git/info/exclude
      # The dump repository is public, so the token of this run can read its artifacts.
      - name: Download the dump
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p "$RUNNER_TEMP/dump" "$RUNNER_TEMP/in" "$RUNNER_TEMP/out"
          gh run download "$RUN" -R "$REPO" -n "$PREFIX$SET" -D "$RUNNER_TEMP/dump"
          ls -laR "$RUNNER_TEMP/dump" | head -n 100
          # highways gives .jsonl.gz files. packing gives a folder for each entry, with predicates.jsonl and run.json.
          for f in "$RUNNER_TEMP"/dump/*.jsonl.gz; do if [ -e "$f" ]; then gzip -dc "$f" > "$RUNNER_TEMP/in/$(basename "$f" .gz)"; fi; done
          (cd "$RUNNER_TEMP/dump" && find . -name '*.jsonl' -exec cp --parents {} "$RUNNER_TEMP/in/" \;)
          find "$RUNNER_TEMP/in" -name '*.jsonl' -exec wc -l {} + | tail -n 5
          cp "$RUNNER_TEMP"/dump/*.md "$RUNNER_TEMP/out/" || true
      - name: Census
        working-directory: packages/predicate-census
        run: |
          rules=()
          if [ -d "$GITHUB_WORKSPACE/highways-tree" ]; then rules=(--highways "$GITHUB_WORKSPACE/highways-tree"); fi
          /usr/bin/time -v node --max-old-space-size=12288 src/cli.ts "$RUNNER_TEMP/in" "${rules[@]}" --out "$RUNNER_TEMP/out/report-$SET.json" 2> "$RUNNER_TEMP/out/time-$SET.txt"
          tail -n 25 "$RUNNER_TEMP/out/time-$SET.txt"
      # The kept part: the files that the repository keeps in packages/predicate-census/results/. The monthly study reads
      # this small artifact, not the raw records. The float-wrong records are a small part of all the records.
      - name: The kept part
        run: |
          mkdir -p "$RUNNER_TEMP/kept"
          node packages/site/src/study-cli.ts float-wrong "$RUNNER_TEMP/out/report-$SET.records.jsonl" "$RUNNER_TEMP/kept/float-wrong-$SET.jsonl.gz"
          cp "$RUNNER_TEMP/out/report-$SET.json" "$RUNNER_TEMP/out/time-$SET.txt" "$RUNNER_TEMP/kept/"
          cp "$RUNNER_TEMP"/out/*.md "$RUNNER_TEMP/kept/" || true
          ls -la "$RUNNER_TEMP/kept"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: census-kept-${{ matrix.set }}
          path: ${{ runner.temp }}/kept
          retention-days: 90
      # The raw records: the records of the census and the input dump, kept 90 days (highways keeps its own 30 days).
      - name: Keep the raw records
        if: always()
        run: |
          gzip -f "$RUNNER_TEMP"/out/*.jsonl || true
          cp "$RUNNER_TEMP"/dump/*.jsonl.gz "$RUNNER_TEMP/out/" || true
          # packing gives plain .jsonl folders: keep them as one archive, because the census keeps its inputs 90 days.
          if [ -z "$(find "$RUNNER_TEMP/dump" -name '*.jsonl.gz' -print -quit)" ]; then tar -czf "$RUNNER_TEMP/out/dump-$SET.tar.gz" -C "$RUNNER_TEMP/dump" .; fi
          ls -la "$RUNNER_TEMP/out"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: census-${{ matrix.set }}
          path: ${{ runner.temp }}/out
          retention-days: 90
