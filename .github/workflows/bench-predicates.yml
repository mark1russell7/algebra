# The bench of the time claim of A5 (docs/ROADMAP.md): @mark1russell7/predicates against robust-predicates.
# It starts packages/predicates-bench, and keeps the raw PairedTime records, the facts of each process and the report.
# Start it with: gh workflow run bench-predicates.yml -R mark1russell7/algebra --ref main
name: Bench predicates

on:
  workflow_dispatch:
    inputs:
      rounds:
        description: The rounds of each case and pair
        default: "31"
      ms:
        description: The time in milliseconds of one batch of the arm a
        default: "10"
      cases:
        description: The names of the cases, with commas. Empty means each case.
        default: ""
      repeat:
        description: The number of times to start the bench. Above 1, each start writes to a folder r1, r2 and so on.
        default: "1"

permissions:
  contents: read

# One bench at a time, so two benches do not share the runner.
concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

jobs:
  bench:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
    env:
      ROUNDS: ${{ inputs.rounds }}
      MS: ${{ inputs.ms }}
      CASES: ${{ inputs.cases }}
      REPEAT: ${{ inputs.repeat }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: The machine
        run: |
          mkdir -p "$RUNNER_TEMP/out"
          { lscpu; nproc; free -m; node --version; git rev-parse HEAD; } > "$RUNNER_TEMP/out/machine.txt"
          cat "$RUNNER_TEMP/out/machine.txt"
      - name: Bench
        working-directory: packages/predicates-bench
        run: |
          if [ "${REPEAT:-1}" -le 1 ]; then
            node src/bench.ts --out "$RUNNER_TEMP/out" --rounds "$ROUNDS" --ms "$MS" ${CASES:+--cases "$CASES"}
          else
            for i in $(seq 1 "$REPEAT"); do
              mkdir -p "$RUNNER_TEMP/out/r$i"
              node src/bench.ts --out "$RUNNER_TEMP/out/r$i" --rounds "$ROUNDS" --ms "$MS" ${CASES:+--cases "$CASES"}
            done
          fi
      - name: Summary
        if: always()
        run: cat "$RUNNER_TEMP/out/report.md" >> "$GITHUB_STEP_SUMMARY" || true
      # The raw records, the facts of each process and the report, kept 90 days.
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: a5-bench
          path: ${{ runner.temp }}/out
          retention-days: 90
